name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Pin espup so an upstream esp-rs release can't silently break CI. Bump when needed.
  ESPUP_VERSION: v0.13.0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check (rp)
        working-directory: rp
        run: rustup run nightly cargo fmt --all -- --check
      - name: cargo fmt --check (esp32s3)
        working-directory: esp32s3
        run: rustup run nightly cargo fmt --all -- --check

  shared-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared source drift (rp vs esp32s3)
        run: python3 scripts/check_shared_sources.py

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv6m-none-eabi, thumbv8m.main-none-eabihf, xtensa-esp32s3-none-elf]
        feature_set: [all, serial, midi]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (RP2040)
        if: matrix.target == 'thumbv6m-none-eabi'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: thumbv6m-none-eabi
          components: clippy

      - name: Install Rust (RP2350)
        if: matrix.target == 'thumbv8m.main-none-eabihf'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: thumbv8m.main-none-eabihf
          components: clippy

      - name: Install Xtensa toolchain
        if: matrix.target == 'xtensa-esp32s3-none-elf'
        run: |
          curl -L "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu" -o espup
          chmod +x espup
          ./espup install
          echo "PATH=$HOME/.rustup/toolchains/esp/bin:$PATH" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build RP2040
        if: matrix.target == 'thumbv6m-none-eabi'
        working-directory: rp
        run: |
          FEATURES="rp2040"
          if [ "${{ matrix.feature_set }}" == "all" ]; then
            FEATURES="$FEATURES,serial,midi"
          else
            FEATURES="$FEATURES,${{ matrix.feature_set }}"
          fi
          rustup run nightly cargo build --release --target thumbv6m-none-eabi --no-default-features --features "$FEATURES" --bin rp2040
          rustup run nightly cargo clippy --release --target thumbv6m-none-eabi --no-default-features --features "$FEATURES" --bin rp2040 -- -D warnings

      - name: Build RP2350
        if: matrix.target == 'thumbv8m.main-none-eabihf'
        working-directory: rp
        run: |
          FEATURES="rp2350"
          if [ "${{ matrix.feature_set }}" == "all" ]; then
            FEATURES="$FEATURES,serial,midi"
          else
            FEATURES="$FEATURES,${{ matrix.feature_set }}"
          fi
          rustup run nightly cargo build --release --target thumbv8m.main-none-eabihf --no-default-features --features "$FEATURES" --bin rp2350
          rustup run nightly cargo clippy --release --target thumbv8m.main-none-eabihf --no-default-features --features "$FEATURES" --bin rp2350 -- -D warnings

      - name: Build RP2350 blinky (sanity binary)
        if: matrix.target == 'thumbv8m.main-none-eabihf' && matrix.feature_set == 'all'
        working-directory: rp
        run: rustup run nightly cargo build --release --target thumbv8m.main-none-eabihf --no-default-features --features rp2350 --bin rp2350_blinky

      - name: Build ESP32-S3
        if: matrix.target == 'xtensa-esp32s3-none-elf'
        working-directory: esp32s3
        run: |
          source $HOME/export-esp.sh
          if [ "${{ matrix.feature_set }}" == "all" ]; then
            FEATURES="serial,midi"
          else
            FEATURES="${{ matrix.feature_set }}"
          fi
          rustup run esp cargo build --release --target xtensa-esp32s3-none-elf --no-default-features --features "$FEATURES" -Zbuild-std=core --bin esp32s3
